name: Ads-Anfragen nach BigQuery

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ads-anfragen
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Abhängigkeiten
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Anfragen übertragen
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: npm run sync
