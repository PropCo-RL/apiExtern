name: Sync Repo to Google Drive

on:
  push:
    branches:
      - main  # Passe das an, falls dein Hauptbranch "master" heißt
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Code-Dateien in eine Textdatei bündeln
        run: |
          echo "=== REPOSITORY CODE BUNDLE ===" > repo_bundle.txt
          find . -maxdepth 2 -type f \( -name "*.js" -o -name "*.html" -o -name "*.css" -o -name "*.json" \) ! -path "*/node_modules/*" -exec sh -c 'echo "\n\n--- FILE: {} ---" >> repo_bundle.txt && cat "{}" >> repo_bundle.txt' \;

      - name: repo_bundle.txt nach Google Drive hochladen
        uses: JavierJeronymo/google-drive-upload-action@v1
        with:
          credentials: ${{ secrets.GDRIVE_SA_JSON }}
          filename: 'repo_bundle.txt'
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          overwrite: 'true'
